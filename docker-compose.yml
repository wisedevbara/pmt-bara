services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pmt-bara-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    networks:
      - pmt-bara-network
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    container_name: pmt-bara-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pmt-bara-network

volumes:
  postgres_data:
    driver: local
  node_modules:
    driver: local

networks:
  pmt-bara-network:
    driver: bridge
